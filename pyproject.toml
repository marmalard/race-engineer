[project]
name = "personal-race-engineer"
version = "0.1.0"
description = "Personal racing engineer for iRacing — telemetry analysis and AI coaching"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.84.0",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "pyttsx3>=2.90",
    "pystray>=0.19.5",
    "pillow>=11.0.0",
    "scipy>=1.17.1",
    "streamlit>=1.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyirsdk>=1.3.6",
]
# Rig-only extras (uv sync --group rig): kokoro drags torch+spacy, so these
# stay out of [project.dependencies] to keep friend installs lean.
rig = [
    "kokoro>=0.9.4",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    # pygame-ce, not pygame: upstream pygame has no Python 3.14 wheel;
    # the CE fork ships cp314 and installs the same `import pygame` namespace.
    "pygame-ce>=2.5.7",
    # kokoro's spacy G2P downloads this model via pip at runtime otherwise --
    # this uv venv has no pip, so the wheel is pinned here instead.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
